<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Squada+One&family=Open+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #ddd; }
  .post {
    position: relative; width: 1080px; height: 1080px; overflow: hidden;
    background: linear-gradient(135deg, #0b1d3a 0%, #1d4ed8 60%, #38bdf8 100%);
    font-family: 'Open Sans', sans-serif; color: #fff;
  }
  .pontos {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,.18) 2px, transparent 2px);
    background-size: 28px 28px;
  }
  .selo {
    position: absolute; top: 70px; right: 80px; padding: 14px 26px; border-radius: 999px;
    background: #facc15; color: #111; font: 700 26px 'Open Sans'; transform: rotate(8deg);
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  h1 {
    position: absolute; left: 80px; top: 200px; width: 760px; margin: 0;
    font: 120px/0.95 'Squada One'; text-transform: uppercase; letter-spacing: 2px;
  }
  h1 em { font-style: normal; color: #facc15; }
  .card {
    position: absolute; left: 80px; bottom: 90px; width: 600px; padding: 32px 36px;
    background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.35); border-radius: 24px;
  }
  .card::before { content: "DICA"; display: block; font: 700 14px 'Open Sans'; letter-spacing: 4px; color: #93c5fd; margin-bottom: 10px; }
  .card p { margin: 0 0 14px; font-size: 24px; line-height: 1.4; }
  .card b { color: #facc15; }
  .card mark { background: #facc15; color: #111; padding: 0 6px; border-radius: 4px; }
  ul { margin: 0; padding-left: 28px; font-size: 22px; line-height: 1.5; }
  .icone { position: absolute; right: 90px; bottom: 100px; width: 260px; height: 260px; }
  .foto { position: absolute; right: 80px; top: 420px; width: 300px; height: 200px; object-fit: cover; border-radius: 16px; border-left: 8px solid #facc15; }
</style>
</head>
<body>
  <div class="post">
    <div class="pontos"></div>
    <div class="selo">Novo!</div>
    <h1>HD vs <em>SSD</em>: qual escolher?</h1>
    <img class="foto" alt="foto do disco" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='200'><rect width='300' height='200' fill='%23334155'/><circle cx='150' cy='100' r='70' fill='%2394a3b8'/></svg>">
    <div class="card">
      <p>O <b>SSD</b> é até <mark>10× mais rápido</mark> que o HD tradicional para abrir programas e ligar o computador.</p>
      <ul>
        <li>Sem peças móveis</li>
        <li>Mais silencioso e <i>econômico</i></li>
      </ul>
    </div>
    <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:#bfdbfe">
      <rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 15h4M15 15h2"/>
    </svg>
  </div>
</body>
</html>
