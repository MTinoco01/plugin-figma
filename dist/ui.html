<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: var(--figma-color-bg, #fff);
    --bg2: var(--figma-color-bg-secondary, #f5f5f5);
    --tx: var(--figma-color-text, #1e1e1e);
    --tx2: var(--figma-color-text-secondary, #6b6b6b);
    --bd: var(--figma-color-border, #e6e6e6);
    --ac: var(--figma-color-bg-brand, #0d99ff);
    --ok: var(--figma-color-text-success, #14ae5c);
    --er: var(--figma-color-text-danger, #f24822);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--tx); font: 12px/1.45 Inter, system-ui, sans-serif; }
  main { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  h1 { font-size: 14px; margin: 0; font-weight: 600; }
  .sub { color: var(--tx2); margin-top: 2px; }
  #zona {
    border: 1.5px dashed var(--bd); border-radius: 10px; padding: 26px 14px; text-align: center;
    background: var(--bg2); transition: border-color .15s, background .15s; cursor: pointer;
  }
  #zona.sobre { border-color: var(--ac); background: color-mix(in srgb, var(--ac) 10%, var(--bg)); }
  #zona strong { display: block; font-size: 13px; margin-bottom: 4px; }
  #zona .tipos { color: var(--tx2); font-size: 11px; }
  .botoes { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
  button {
    font: inherit; border: 1px solid var(--bd); background: var(--bg); color: var(--tx);
    border-radius: 6px; padding: 6px 12px; cursor: pointer;
  }
  button.pri { background: var(--ac); border-color: var(--ac); color: #fff; font-weight: 500; }
  button:disabled { opacity: .5; cursor: default; }
  details { border: 1px solid var(--bd); border-radius: 8px; padding: 0 10px; }
  details[open] { padding-bottom: 10px; }
  summary { cursor: pointer; padding: 8px 0; font-weight: 500; }
  textarea {
    width: 100%; height: 130px; resize: vertical; font: 11px/1.4 "Roboto Mono", Consolas, monospace;
    background: var(--bg2); color: var(--tx); border: 1px solid var(--bd); border-radius: 6px; padding: 8px;
  }
  .opcoes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
  .opcoes label { display: flex; flex-direction: column; gap: 3px; color: var(--tx2); }
  .opcoes label.chk { flex-direction: row; align-items: center; gap: 6px; color: var(--tx); grid-column: 1 / -1; }
  input[type=number], select {
    font: inherit; color: var(--tx); background: var(--bg2); border: 1px solid var(--bd); border-radius: 6px; padding: 5px 7px;
  }
  #log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; max-height: 190px; overflow: auto; }
  #log li { display: flex; gap: 8px; align-items: baseline; padding: 6px 8px; border-radius: 6px; background: var(--bg2); }
  #log li .st { width: 14px; flex: none; text-align: center; }
  #log li.ok .st { color: var(--ok); }
  #log li.er .st { color: var(--er); }
  #log li .msg { color: var(--tx2); margin-left: auto; text-align: right; }
  #status { color: var(--tx2); min-height: 17px; }
  #palco { position: fixed; left: -30000px; top: 0; border: 0; background: #fff; }
</style>
</head>
<body>
<main>
  <div>
    <h1>Arquivo para Figma</h1>
    <div class="sub">Solte um arquivo e ele vira camadas editáveis no Figma.</div>
  </div>

  <div id="zona" tabindex="0">
    <strong>Solte arquivos ou pastas aqui</strong>
    <div class="tipos">HTML · Markdown · DOCX · PDF · SVG · PNG/JPG/GIF/WebP · TXT · CSV · JSON</div>
    <div class="tipos">Junto com um HTML, solte as imagens, CSS e fontes que ele usa (ou a pasta inteira).</div>
    <div class="botoes">
      <button class="pri" id="escolher">Escolher arquivos</button>
      <button id="pasta">Escolher pasta</button>
    </div>
    <input id="arquivos" type="file" multiple hidden>
    <input id="diretorio" type="file" webkitdirectory multiple hidden>
  </div>

  <details id="colar">
    <summary>Colar HTML</summary>
    <textarea id="html" placeholder="Cole o HTML aqui (página inteira ou só um trecho)"></textarea>
    <div class="botoes" style="justify-content:flex-end"><button class="pri" id="converter">Converter</button></div>
  </details>

  <details id="opts">
    <summary>Opções</summary>
    <div class="opcoes">
      <label>Largura da tela (px)<input id="o-largura" type="number" min="200" max="8000" value="1440"></label>
      <label>Altura da tela (px)<input id="o-altura" type="number" min="200" max="8000" value="900"></label>
      <label>Frame raiz
        <select id="o-raiz">
          <option value="auto">Automático</option>
          <option value="pagina">Página inteira</option>
          <option value="filhos">Cada filho do body</option>
        </select>
      </label>
      <label>Espera extra (ms)<input id="o-espera" type="number" min="0" max="20000" step="100" value="400"></label>
      <label class="chk"><input id="o-quebras" type="checkbox" checked> Quebras de linha idênticas ao original</label>
      <label class="chk"><input id="o-achatar" type="checkbox" checked> Remover divs sem estilo (menos camadas)</label>
      <label class="chk"><input id="o-svg" type="checkbox" checked> Imagens .svg como vetor editável</label>
    </div>
  </details>

  <div id="status"></div>
  <ul id="log"></ul>
</main>
<iframe id="palco"></iframe>
<script>
const px = v => parseFloat(v) || 0;
const clamp01 = v => Math.max(0, Math.min(1, v));

const _cv = document.createElement('canvas');
_cv.width = _cv.height = 1;
const _cx = _cv.getContext('2d', { willReadFrequently: true });
const _cores = new Map();

function cor(str) {
  if (!str) return null;
  str = String(str).trim();
  if (_cores.has(str)) return _cores.get(str);
  let c = null;
  const m = str.match(/^rgba?\(\s*([\d.]+)[,\s]+([\d.]+)[,\s]+([\d.]+)(?:\s*[,/]\s*([\d.]+)(%?))?\s*\)$/);
  if (m) {
    const a = m[4] == null ? 1 : m[5] ? m[4] / 100 : +m[4];
    c = { r: clamp01(m[1] / 255), g: clamp01(m[2] / 255), b: clamp01(m[3] / 255), a: clamp01(a) };
  } else if (str === 'transparent' || str === 'none') {
    c = { r: 0, g: 0, b: 0, a: 0 };
  } else {
    _cx.clearRect(0, 0, 1, 1);
    _cx.fillStyle = 'rgba(0,0,0,0)';
    _cx.fillStyle = str;
    _cx.fillRect(0, 0, 1, 1);
    const d = _cx.getImageData(0, 0, 1, 1).data;
    c = { r: d[0] / 255, g: d[1] / 255, b: d[2] / 255, a: d[3] / 255 };
  }
  _cores.set(str, c);
  return c;
}

const visivel = c => c && c.a > 0.001;
const solido = c => ({ type: 'SOLID', color: { r: c.r, g: c.g, b: c.b }, opacity: c.a });

function dividir(str, sep = ',') {
  const out = [];
  let nivel = 0, aspas = null, atual = '';
  for (const ch of str) {
    if (aspas) { if (ch === aspas) aspas = null; atual += ch; continue; }
    if (ch === '"' || ch === "'") { aspas = ch; atual += ch; continue; }
    if (ch === '(') nivel++;
    if (ch === ')') nivel--;
    if (nivel === 0 && (sep === ' ' ? /\s/.test(ch) : ch === sep)) {
      if (atual.trim()) out.push(atual.trim());
      atual = '';
    } else atual += ch;
  }
  if (atual.trim()) out.push(atual.trim());
  return out;
}

const RE_COR = /(?:rgba?|hsla?|hwb|lab|lch|oklab|oklch|color)\([^)]*\)|#[0-9a-f]{3,8}\b|\b(?!inset\b)[a-z]+\b/i;
function separarCor(parte) {
  const m = parte.match(RE_COR);
  if (!m) return { c: null, resto: parte };
  return { c: cor(m[0]), resto: (parte.slice(0, m.index) + ' ' + parte.slice(m.index + m[0].length)).trim() };
}

function inverter([[a, b, c], [d, e, f]]) {
  const det = a * e - b * d || 1e-9;
  return [[e / det, -b / det, (b * f - e * c) / det], [-d / det, a / det, (d * c - a * f) / det]];
}

function angulo(s) {
  const m = s.match(/^(-?[\d.]+)(deg|rad|turn|grad)$/);
  if (!m) return null;
  const v = +m[1];
  return { deg: v, rad: v * 180 / Math.PI, turn: v * 360, grad: v * 0.9 }[m[2]];
}

function paradas(partes, L) {
  const st = [];
  for (const p of partes) {
    const { c, resto } = separarCor(p);
    if (!c) continue;
    const pos = resto.split(/\s+/).filter(Boolean).map(t =>
      t.endsWith('%') ? px(t) / 100 : t.endsWith('px') ? px(t) / (L || 1) : null);
    const color = { r: c.r, g: c.g, b: c.b, a: c.a };
    if (!pos.length) st.push({ position: null, color });
    for (const q of pos) st.push({ position: q, color });
  }
  if (st.length < 2) return null;
  if (st[0].position == null) st[0].position = 0;
  if (st[st.length - 1].position == null) st[st.length - 1].position = 1;
  for (let i = 1; i < st.length; i++) {
    if (st[i].position == null) {
      let j = i; while (st[j].position == null) j++;
      const a = st[i - 1].position, b = st[j].position;
      for (let k = i; k < j; k++) st[k].position = a + (b - a) * (k - i + 1) / (j - i + 1);
    }
    st[i].position = Math.max(st[i].position, st[i - 1].position);
  }
  for (const s of st) s.position = clamp01(s.position);
  return st;
}

function lerPosicao(str, w, h) {
  const t = str.trim().split(/\s+/);
  const kw = { left: 0, center: 0.5, right: 1, top: 0, bottom: 1 };
  let x = 0.5, y = 0.5;
  const val = (v, total) => v.endsWith('%') ? px(v) / 100 : px(v) / total;
  if (t.length === 1) {
    if (t[0] === 'top' || t[0] === 'bottom') y = kw[t[0]];
    else x = t[0] in kw ? kw[t[0]] : val(t[0], w);
  } else {
    let [a, b] = t;
    if (a === 'top' || a === 'bottom' || b === 'left' || b === 'right') [a, b] = [b, a];
    x = a in kw ? kw[a] : val(a, w);
    y = b in kw ? kw[b] : val(b, h);
  }
  return [x * w, y * h];
}

function gradienteLinear(partes, w, h) {
  let dx = 0, dy = 1;
  if (partes[0].startsWith('in ')) partes = partes.slice(1);
  const primeiro = partes[0].replace(/\s+in\s+.*$/, '');
  const a = angulo(primeiro);
  if (a != null) {
    const t = a * Math.PI / 180; dx = Math.sin(t); dy = -Math.cos(t); partes = partes.slice(1);
  } else if (primeiro.startsWith('to ')) {
    const sx = /right/.test(primeiro) ? 1 : /left/.test(primeiro) ? -1 : 0;
    const sy = /bottom/.test(primeiro) ? 1 : /top/.test(primeiro) ? -1 : 0;
    if (sx && sy) { dx = sx * h; dy = sy * w; } else { dx = sx; dy = sy; }
    const n = Math.hypot(dx, dy) || 1; dx /= n; dy /= n; partes = partes.slice(1);
  }
  const L = Math.abs(w * dx) + Math.abs(h * dy) || 1;
  const st = paradas(partes, L);
  if (!st) return null;
  const p0 = [(w / 2 - dx * L / 2) / w, (h / 2 - dy * L / 2) / h];
  const p1 = [(w / 2 + dx * L / 2) / w, (h / 2 + dy * L / 2) / h];
  const xc = [p1[0] - p0[0], p1[1] - p0[1]];
  const yc = [-dy * L / w, dx * L / h];
  const o = [p0[0] - yc[0] / 2, p0[1] - yc[1] / 2];
  return { type: 'GRADIENT_LINEAR', gradientStops: st,
    gradientTransform: inverter([[xc[0], yc[0], o[0]], [xc[1], yc[1], o[1]]]) };
}

function gradienteRadial(partes, w, h) {
  let cfg = '';
  if (/^(circle|ellipse|closest|farthest|at\s|-?[\d.]+(px|%))/.test(partes[0]) || partes[0].startsWith('in ')) {
    cfg = partes[0].replace(/\bin\s+\S+(\s+\S+)?/, '').trim(); partes = partes.slice(1);
  }
  const [forma, pos] = cfg.split(/\bat\b/).map(s => (s || '').trim());
  const [cx, cy] = pos ? lerPosicao(pos, w, h) : [w / 2, h / 2];
  const lados = { closest: [Math.min(cx, w - cx), Math.min(cy, h - cy)],
                  farthest: [Math.max(cx, w - cx), Math.max(cy, h - cy)] };
  const circ = /circle/.test(forma) || (/^-?[\d.]+px$/.test(forma.split(/\s+/)[0]) && forma.split(/\s+/).filter(t => /\d/.test(t)).length === 1);
  const medidas = forma.split(/\s+/).filter(t => /^-?[\d.]+(px|%)$/.test(t));
  let rx, ry;
  if (medidas.length) {
    rx = medidas[0].endsWith('%') ? px(medidas[0]) / 100 * w : px(medidas[0]);
    ry = medidas[1] ? (medidas[1].endsWith('%') ? px(medidas[1]) / 100 * h : px(medidas[1])) : rx;
  } else {
    const tipo = /closest-side/.test(forma) ? 'cs' : /farthest-side/.test(forma) ? 'fs' : /closest-corner/.test(forma) ? 'cc' : 'fc';
    const [lx, ly] = lados[tipo[0] === 'c' ? 'closest' : 'farthest'];
    if (circ) {
      const cantos = [[0, 0], [w, 0], [0, h], [w, h]].map(([x, y]) => Math.hypot(x - cx, y - cy));
      rx = ry = tipo === 'cs' ? Math.min(lx, ly) : tipo === 'fs' ? Math.max(lx, ly)
        : tipo === 'cc' ? Math.min(...cantos) : Math.max(...cantos);
    } else {
      const k = tipo.endsWith('c') ? Math.SQRT2 : 1;
      rx = lx * k; ry = ly * k;
    }
  }
  rx = Math.max(rx, 0.01); ry = Math.max(ry, 0.01);
  const st = paradas(partes, rx);
  if (!st) return null;
  const xc = [2 * rx / w, 0], yc = [0, 2 * ry / h];
  const o = [cx / w - xc[0] / 2, cy / h - yc[1] / 2];
  return { type: 'GRADIENT_RADIAL', gradientStops: st,
    gradientTransform: inverter([[xc[0], yc[0], o[0]], [xc[1], yc[1], o[1]]]) };
}

function gradiente(str, w, h) {
  const m = str.match(/^([a-z-]+)\((.*)\)$/s);
  if (!m) return null;
  const partes = dividir(m[2]);
  if (m[1] === 'linear-gradient') return gradienteLinear(partes, w, h);
  if (m[1] === 'radial-gradient') return gradienteRadial(partes, w, h);
  return null;
}

const urlDe = s => { const m = s.match(/^url\(\s*["']?(.*?)["']?\s*\)$/s); return m ? m[1] : null; };

function fundo(cs, w, h, reg) {
  const fills = [];
  const bg = cor(cs.backgroundColor);
  if (visivel(bg)) fills.push(solido(bg));
  const img = cs.backgroundImage;
  if (!img || img === 'none') return { fills, raster: false };
  const camadas = dividir(img), tamanhos = dividir(cs.backgroundSize), repet = dividir(cs.backgroundRepeat);
  const sobre = [];
  for (let i = 0; i < camadas.length; i++) {
    const c = camadas[i];
    if (c === 'none') continue;
    const tam = (tamanhos[i % tamanhos.length] || 'auto').trim();
    const rep = (repet[i % repet.length] || 'repeat').trim();
    const cobre = /^(auto|auto auto|100% 100%)$/.test(tam);
    const u = urlDe(c);
    if (u) {
      const modo = tam === 'cover' ? 'FILL' : tam === 'contain' && /no-repeat/.test(rep) ? 'FIT' : tam === '100% 100%' ? 'CROP' : null;
      if (!modo) return { fills, raster: true };
      sobre.push({ type: 'IMAGE', key: reg.imagem(u), mode: modo });
      continue;
    }
    const g = cobre ? gradiente(c, w, h) : null;
    if (!g) return { fills, raster: true };
    sobre.push(g);
  }
  return { fills: fills.concat(sobre.reverse()), raster: false };
}

const LADOS = ['Top', 'Right', 'Bottom', 'Left'];

function borda(cs) {
  const lados = LADOS.map(L => {
    const estilo = cs['border' + L + 'Style'];
    const w = estilo === 'none' || estilo === 'hidden' ? 0 : px(cs['border' + L + 'Width']);
    return { w, c: cor(cs['border' + L + 'Color']), estilo };
  });
  const ativos = lados.filter(l => l.w > 0 && visivel(l.c));
  if (!ativos.length) return null;
  const mesmaCor = ativos.every(l => l.c.r === ativos[0].c.r && l.c.g === ativos[0].c.g && l.c.b === ativos[0].c.b && l.c.a === ativos[0].c.a);
  const w = l => (l.w > 0 && visivel(l.c) ? l.w : 0);
  if (!mesmaCor) return { lados: lados.map(l => (w(l) ? l : null)) };
  const e = ativos[0].estilo, bw = ativos[0].w;
  const dash = e === 'dashed' ? [bw * 3, bw * 2] : e === 'dotted' ? [bw, bw] : null;
  return { paint: solido(ativos[0].c), top: w(lados[0]), right: w(lados[1]), bottom: w(lados[2]), left: w(lados[3]), dash };
}

function cantos(cs, w, h) {
  const r = ['TopLeft', 'TopRight', 'BottomRight', 'BottomLeft'].map(k => {
    const v = (cs['border' + k + 'Radius'] || '0').split(/\s+/)[0];
    return v.endsWith('%') ? Math.min(w, h) * px(v) / 100 : px(v);
  });
  if (!r.some(Boolean)) return null;
  const f = Math.min(1, w / (r[0] + r[1] || 1), w / (r[3] + r[2] || 1), h / (r[0] + r[3] || 1), h / (r[1] + r[2] || 1));
  return r.map(v => v * f);
}

function sombras(str, texto) {
  if (!str || str === 'none') return [];
  return dividir(str).map(p => {
    const inset = /\binset\b/.test(p);
    const { c, resto } = separarCor(p.replace(/\binset\b/, ''));
    const n = resto.split(/\s+/).filter(Boolean).map(px);
    if (!c || n.length < 2) return null;
    const fx = { type: inset ? 'INNER_SHADOW' : 'DROP_SHADOW', color: { r: c.r, g: c.g, b: c.b, a: c.a },
      offset: { x: n[0], y: n[1] }, radius: n[2] || 0, spread: texto ? 0 : n[3] || 0, visible: true, blendMode: 'NORMAL' };
    if (!inset) fx.showShadowBehindNode = false;
    return fx;
  }).filter(Boolean).reverse();
}

function filtros(cs) {
  const fx = [];
  const f = cs.filter || '', b = cs.backdropFilter || cs.webkitBackdropFilter || '';
  let m = f.match(/blur\(([\d.]+)px\)/);
  if (m && +m[1]) fx.push({ type: 'LAYER_BLUR', radius: +m[1] * 2, visible: true });
  for (const d of f.matchAll(/drop-shadow\(((?:[^()]|\([^)]*\))*)\)/g)) fx.push(...sombras(d[1], true));
  m = b.match(/blur\(([\d.]+)px\)/);
  if (m && +m[1]) fx.push({ type: 'BACKGROUND_BLUR', radius: +m[1] * 2, visible: true });
  return fx;
}

const MISTURAS = { multiply: 'MULTIPLY', screen: 'SCREEN', overlay: 'OVERLAY', darken: 'DARKEN', lighten: 'LIGHTEN',
  'color-dodge': 'COLOR_DODGE', 'color-burn': 'COLOR_BURN', 'hard-light': 'HARD_LIGHT', 'soft-light': 'SOFT_LIGHT',
  difference: 'DIFFERENCE', exclusion: 'EXCLUSION', hue: 'HUE', saturation: 'SATURATION', color: 'COLOR', luminosity: 'LUMINOSITY' };
const mistura = cs => MISTURAS[cs.mixBlendMode] || null;

function bytesDeDataURL(u) {
  const [cab, dados] = u.split(',');
  if (/;base64/i.test(cab)) {
    const bin = atob(dados);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  return new TextEncoder().encode(decodeURIComponent(dados));
}

async function blobDe(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.blob();
}

const dataURLDe = blob => new Promise((ok, erro) => {
  const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.onerror = erro; fr.readAsDataURL(blob);
});

function carregarImg(src) {
  return new Promise((ok, erro) => {
    const im = new Image();
    im.crossOrigin = 'anonymous';
    im.onload = () => ok(im); im.onerror = () => erro(new Error('imagem não carregou'));
    im.src = src;
  });
}

const canvasParaBytes = cv => new Promise((ok, erro) => cv.toBlob(async b => {
  if (!b) return erro(new Error('canvas vazio'));
  ok(new Uint8Array(await b.arrayBuffer()));
}, 'image/png'));

async function paraPNG(fonte, w, h) {
  const k = Math.min(1, 4096 / Math.max(w, h));
  const cv = document.createElement('canvas');
  cv.width = Math.max(1, Math.round(w * k)); cv.height = Math.max(1, Math.round(h * k));
  cv.getContext('2d').drawImage(fonte, 0, 0, cv.width, cv.height);
  return canvasParaBytes(cv);
}

async function bytesDeImagem(url) {
  const blob = await blobDe(url);
  const tipo = blob.type;
  const bytes = new Uint8Array(await blob.arrayBuffer());
  const ok = /^image\/(png|jpe?g|gif)$/.test(tipo) || (!tipo && (bytes[0] === 0x89 || bytes[0] === 0xff || bytes[0] === 0x47));
  if (ok) {
    const im = await carregarImg(URL.createObjectURL(blob)).catch(() => null);
    if (!im || Math.max(im.naturalWidth, im.naturalHeight) <= 4096) return bytes;
    return paraPNG(im, im.naturalWidth, im.naturalHeight);
  }
  const im = await carregarImg(URL.createObjectURL(blob));
  const w = im.naturalWidth || 512, h = im.naturalHeight || 512;
  const k = /svg/.test(tipo) ? 2 : 1;
  return paraPNG(im, w * k, h * k);
}

async function embutirURLs(css) {
  const urls = [...css.matchAll(/url\(\s*["']?(.*?)["']?\s*\)/g)].map(m => m[1]).filter(u => !u.startsWith('data:'));
  for (const u of new Set(urls)) {
    try { css = css.split(u).join(await dataURLDe(await blobDe(u))); } catch (e) {}
  }
  return css;
}

async function rasterizarFundo(cs, w, h) {
  const props = ['background-color', 'background-image', 'background-size', 'background-position',
    'background-repeat', 'background-blend-mode', 'background-origin', 'background-clip'];
  let css = props.map(p => p + ':' + cs.getPropertyValue(p)).join(';');
  css = await embutirURLs(css);
  const esc = css.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><foreignObject width="100%" height="100%">` +
    `<div xmlns="http://www.w3.org/1999/xhtml" style="width:${w}px;height:${h}px;${esc}"></div></foreignObject></svg>`;
  const im = await carregarImg('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg));
  return paraPNG(im, w * 2, h * 2);
}

const IGNORAR = new Set(['SCRIPT', 'STYLE', 'LINK', 'META', 'TITLE', 'HEAD', 'TEMPLATE', 'NOSCRIPT', 'BASE']);
const ATOMICOS = new Set(['IMG', 'SVG', 'INPUT', 'TEXTAREA', 'SELECT', 'BUTTON', 'CANVAS', 'VIDEO', 'IFRAME', 'OBJECT', 'EMBED', 'PICTURE', 'AUDIO', 'METER', 'PROGRESS']);
const CAIXA_TEXTO = { center: 'CENTER', right: 'RIGHT', end: 'RIGHT', justify: 'JUSTIFIED', '-webkit-center': 'CENTER' };
const CASOS = { uppercase: 'UPPER', lowercase: 'LOWER', capitalize: 'TITLE' };

class Registro {
  constructor() { this.urls = new Map(); this.bytes = {}; this.n = 0; }
  imagem(url) {
    if (!this.urls.has(url)) this.urls.set(url, 'IMG' + (++this.n));
    return this.urls.get(url);
  }
  dados(u8) { const k = 'RAW' + (++this.n); this.bytes[k] = u8; return k; }
  async resolver(progresso) {
    const lista = [...this.urls];
    let feitos = 0;
    await Promise.all(lista.map(async ([url, k]) => {
      try { this.bytes[k] = await bytesDeImagem(url); } catch (e) { console.warn('imagem falhou', url, e); }
      progresso && progresso('Baixando imagens… ' + (++feitos) + '/' + lista.length);
    }));
    return this.bytes;
  }
}

function nomeDe(el) {
  const tag = el.tagName.toLowerCase();
  if (el.id) return tag + '#' + el.id;
  const cls = typeof el.className === 'string' && el.className.trim().split(/\s+/)[0];
  return cls && !cls.startsWith('__h2f') ? tag + '.' + cls : tag;
}

function criarMedidor(doc, win, opts) {
  const reg = new Registro();
  const css = el => win.getComputedStyle(el);
  const alturas = new Map();
  const rotacoes = new Map();

  function injetarEstilo() {
    const st = doc.createElement('style');
    st.textContent = '*,*::before,*::after{transition:none!important;caret-color:transparent!important}' +
      'html{scrollbar-width:none!important}::-webkit-scrollbar{display:none!important}' +
      '[data-h2f-b]::before{content:none!important}[data-h2f-a]::after{content:none!important}';
    (doc.head || doc.documentElement).appendChild(st);
  }

  function materializarPseudos() {
    for (const el of [...doc.body.querySelectorAll('*'), doc.body]) {
      if (IGNORAR.has(el.tagName) || ATOMICOS.has(el.tagName) || el.namespaceURI !== 'http://www.w3.org/1999/xhtml') continue;
      for (const [pseudo, attr] of [['::before', 'data-h2f-b'], ['::after', 'data-h2f-a']]) {
        const cs = win.getComputedStyle(el, pseudo);
        const content = cs.content;
        if (!content || content === 'none' || content === 'normal' || cs.display === 'none') continue;
        const span = doc.createElement('span');
        span.className = '__h2f-pseudo';
        for (let i = 0; i < cs.length; i++) {
          const p = cs[i];
          if (p === 'content' || p.startsWith('--')) continue;
          span.style.setProperty(p, cs.getPropertyValue(p));
        }
        let texto = '';
        for (const parte of dividir(content, ' ')) {
          if (/^["']/.test(parte)) texto += parte.slice(1, -1).replace(/\\([0-9a-f]{1,6})\s?/gi, (_, h) => String.fromCodePoint(parseInt(h, 16))).replace(/\\(.)/g, '$1');
          else if (/^attr\(/.test(parte)) texto += el.getAttribute(parte.slice(5, -1).trim()) || '';
          else if (/^url\(/.test(parte)) {
            const img = doc.createElement('img'); img.src = urlDe(parte); span.appendChild(img);
          }
        }
        if (texto) span.appendChild(doc.createTextNode(texto));
        if (pseudo === '::before') el.insertBefore(span, el.firstChild); else el.appendChild(span);
        el.setAttribute(attr, '');
      }
    }
  }

  function normalizarTransformacoes() {
    for (const el of doc.querySelectorAll('*')) {
      if (!(el instanceof win.HTMLElement)) continue;
      const cs = css(el);
      let ang = 0;
      if (cs.rotate && cs.rotate !== 'none') {
        const a = angulo(cs.rotate.split(/\s+/).pop());
        if (a) ang += a;
        el.style.setProperty('rotate', 'none', 'important');
      }
      const t = cs.transform;
      if (t && t !== 'none') {
        const v = t.match(/\((.*)\)/)[1].split(',').map(Number);
        const [a, b, c, d, e, f] = v.length === 16 ? [v[0], v[1], v[4], v[5], v[12], v[13]] : v;
        const rot = Math.atan2(b, a) * 180 / Math.PI;
        if (Math.abs(rot) > 0.01) {
          const s = Math.hypot(a, b);
          const [ox, oy] = cs.transformOrigin.split(' ').map(px);
          const vx = el.offsetWidth / 2 - ox, vy = el.offsetHeight / 2 - oy;
          const tx = a * vx + c * vy + e - s * vx, ty = b * vx + d * vy + f - s * vy;
          el.style.setProperty('transform', `matrix(${s}, 0, 0, ${s}, ${tx}, ${ty})`, 'important');
          ang += rot;
        }
      }
      if (Math.abs(ang) > 0.01) rotacoes.set(el, ang);
    }
  }

  function alturaNormal(cs) {
    const k = cs.fontFamily + '|' + cs.fontSize + '|' + cs.fontWeight + '|' + cs.fontStyle;
    if (alturas.has(k)) return alturas.get(k);
    const s = doc.createElement('div');
    s.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden;white-space:nowrap;line-height:normal;display:block;padding:0;border:0;margin:0';
    s.style.fontFamily = cs.fontFamily; s.style.fontSize = cs.fontSize;
    s.style.fontWeight = cs.fontWeight; s.style.fontStyle = cs.fontStyle;
    s.textContent = 'Hg';
    doc.body.appendChild(s);
    const h = s.getBoundingClientRect().height;
    s.remove();
    alturas.set(k, h);
    return h;
  }

  const escalas = new Map();
  function escalaDe(el) {
    if (!el || !el.offsetWidth) return 1;
    if (!escalas.has(el)) {
      const k = el.getBoundingClientRect().width / el.offsetWidth;
      escalas.set(el, Math.abs(k - 1) < 0.01 ? 1 : k);
    }
    return escalas.get(el);
  }

  const familias = cs => cs.fontFamily.split(',').map(f => f.replace(/["']/g, '').trim()).filter(Boolean);

  function estiloDoTexto(el, bloco) {
    const cs = css(el);
    let deco = '';
    for (let e = el; e && e !== bloco.parentElement; e = e.parentElement) {
      deco += ' ' + css(e).textDecorationLine;
      if (e === bloco) break;
    }
    const preenchimento = cor(cs.webkitTextFillColor && cs.webkitTextFillColor !== cs.color ? cs.webkitTextFillColor : cs.color);
    const a = el.closest('a[href]');
    const k = escalaDe(bloco);
    return {
      fam: familias(cs), wt: +cs.fontWeight || 400, it: /italic|oblique/.test(cs.fontStyle),
      size: px(cs.fontSize) * k, cor: preenchimento,
      ls: (cs.letterSpacing === 'normal' ? 0 : px(cs.letterSpacing)) * k,
      lh: (cs.lineHeight === 'normal' ? alturaNormal(cs) : px(cs.lineHeight)) * k,
      tc: cs.fontVariantCaps === 'small-caps' ? 'SMALL_CAPS' : CASOS[cs.textTransform] || null,
      td: /line-through/.test(deco) ? 'STRIKETHROUGH' : /underline/.test(deco) ? 'UNDERLINE' : null,
      href: a && bloco.contains(a) ? a.href : null,
      rtl: cs.direction === 'rtl', ws: cs.whiteSpace, vis: cs.visibility === 'visible',
    };
  }

  function textoDoTrecho(itens, bloco, base, clipTexto, saida) {
    const segs = [];
    const linhas = [];
    let pendente = null, espaco = null, folgaAntes = 0, anterior = null, inicioLinha = true, quebrou = false;
    const range = doc.createRange();
    const blocoCs = css(bloco);
    const al = CAIXA_TEXTO[blocoCs.textAlign] || 'LEFT';

      const ult = segs[segs.length - 1];
      if (ult && ult.st === st) ult.s += ch; else segs.push({ s: ch, st });
    };
    const alargarUltimo = (extra) => {
      const ult = segs[segs.length - 1];
      const chars = [...ult.s], ch = chars.pop();
      ult.s = chars.join('');
      if (!ult.s) segs.pop();
      segs.push({ s: ch, st: { ...ult.st, ls: ult.st.ls + extra } });
    };

    const visitar = (no) => {
      if (no.nodeType === 3) return letras(no);
      if (no.nodeType !== 1) return;
      if (no.tagName === 'BR') {

        return;

    const letras = (tn) => {
      const st = estiloDoTexto(tn.parentElement, bloco);
      if (!st.vis) return;
      const colapsa = !/^(pre|pre-wrap|break-spaces)$/.test(st.ws);
      const mantemQuebra = !colapsa || st.ws === 'pre-line';
      const d = tn.data;
      for (let i = 0; i < d.length; i++) {

        const cc = d.charCodeAt(i);

        if (dupla) ch = d.slice(i, i + 2);

          if (voltou && r.top > anterior.top + 1) {
            novaLinha = quebrou = true;
            if (exato) { emitir('\n', pendente || st); pendente = null; }
            linhas.push({ top: r.top, h: r.height, lh: st.lh, l: r.left, r: r.right });
          }
        } else if (!linhas.length || inicioLinha) {
          linhas.push({ top: r.top, h: r.height, lh: st.lh, l: r.left, r: r.right });
        }

          ? r.left - (pendente && espaco ? espaco.right : anterior.right) : 0;
        if (pendente) {
          if (folgaAntes > 1 && segs.length) alargarUltimo(folgaAntes);
          emitir(' ', pendente); pendente = null;
        }
        folgaAntes = 0;
        if (folga > 1 && segs.length) alargarUltimo(folga);
        emitir(ch, st);
        const L = linhas[linhas.length - 1];
        L.l = Math.min(L.l, r.left); L.r = Math.max(L.r, r.right);
        anterior = r; inicioLinha = false;
      }
    };

    for (const it of itens) visitar(it);
    range.detach && range.detach();
    while (segs.length && /^\s*$/.test(segs[segs.length - 1].s)) segs.pop();
    if (!segs.length || !linhas.length) return;
    segs[segs.length - 1].s = segs[segs.length - 1].s.replace(/\s+$/, '');

    const x0 = Math.min(...linhas.map(l => l.l)), x1 = Math.max(...linhas.map(l => l.r));
    const p = linhas[0];
    const y = p.top - (p.lh - p.h) / 2 - base.y;
    const no = { t: 'T', al, y, segs: [] };
    const conteudo = caixaConteudo(bloco);
    if (exato || !quebrou) {
      no.auto = 'WH';
      if (al === 'CENTER') { no.ax = 'c'; no.x = (x0 + x1) / 2 - base.x; }
      else if (al === 'RIGHT') { no.ax = 'r'; no.x = x1 - base.x; }
      else { no.ax = 'l'; no.x = x0 - base.x; }
      if (al === 'JUSTIFIED') no.al = 'LEFT';
    } else {
      no.auto = 'H'; no.ax = 'l';
      no.x = conteudo.left - base.x; no.w = conteudo.right - conteudo.left + 1;
    }
    const w = x1 - x0, h = linhas[linhas.length - 1].top + linhas[linhas.length - 1].lh - p.top;

      const st = sg.st;
      let fill = visivel(st.cor) ? solido(st.cor) : null;
      if (!fill && clipTexto) fill = gradiente(dividir(clipTexto.backgroundImage)[0] || '', w, h);
      no.segs.push({ s: sg.s, fam: st.fam, wt: st.wt, it: st.it, size: st.size, fill: fill || solido({ r: 0, g: 0, b: 0, a: 0 }),
        ls: st.ls, lh: st.lh, tc: st.tc, td: st.td, href: st.href });
    }
    const tcs = css(itens[0].nodeType === 1 ? itens[0] : itens[0].parentElement);
    const sh = sombras(tcs.textShadow, true);
    if (sh.length) no.fx = sh;
    const sw = px(tcs.webkitTextStrokeWidth);
    if (sw > 0) no.tstroke = { paint: solido(cor(tcs.webkitTextStrokeColor)), w: sw };

  function decorarInline(el, base, saida) {
    const cs = css(el);

        fills: fundo(cs, r.width, r.height, reg).fills, rad: cantos(cs, r.width, r.height) };
      if (bd && bd.paint) no.stroke = bd;
      if (sh.length) no.fx = sh;
      saida.push({ no, grupo: 0, z: 0 });

  function caixaConteudo(el) {

      left: r.left + px(cs.borderLeftWidth) + px(cs.paddingLeft),
      right: r.right - px(cs.borderRightWidth) - px(cs.paddingRight),
      top: r.top + px(cs.borderTopWidth) + px(cs.paddingTop),

  }

  function inlineDeTexto(el) {

    if (el.tagName === 'BR') return true;
    if (IGNORAR.has(el.tagName)) return true;
    if (ATOMICOS.has(el.tagName) || el.namespaceURI !== 'http://www.w3.org/1999/xhtml') return false;

  function expandir(el) {

      const d = css(c).display;
      if (d === 'none') continue;
      if (d === 'contents' || (d === 'inline' && !inlineDeTexto(c) && !ATOMICOS.has(c.tagName))) out.push(...expandir(c));

    }

  function chaveZ(cs) {
    const pos = cs.position !== 'static';
    const z = cs.zIndex === 'auto' ? 0 : +cs.zIndex;

    return z < 0 ? { grupo: -1, z } : z === 0 ? { grupo: 1, z: 0 } : { grupo: 2, z };
  }

  async function filhos(el, base, clipTexto) {
    const saida = [];
    let trecho = [];
    const fechar = () => {
      if (trecho.length && trecho.some(n => (n.nodeType === 3 ? /\S/.test(n.data) : true))) textoDoTrecho(trecho, el, base, clipTexto, saida);
      trecho = [];
    };
    for (const c of expandir(el)) {
      if (c.nodeType === 3 || inlineDeTexto(c)) { trecho.push(c); continue; }
      fechar();
      const no = await elemento(c, base, clipTexto);
      if (no) saida.push({ no, ...chaveZ(css(c)) });
    }
    fechar();
    return saida.map((s, i) => ({ ...s, i })).sort((a, b) => a.grupo - b.grupo || a.z - b.z || a.i - b.i).map(s => s.no);
  }

  function caixa(el, base) {
    const r = el.getBoundingClientRect();
    const o = { x: r.left - base.x, y: r.top - base.y, w: r.width, h: r.height, n: nomeDe(el) };
    const ang = rotacoes.get(el);
    if (ang) o.r = ang;
    return { o, r };
  }

  function estiloDeCaixa(o, cs, el) {

  function ladosDeBorda(lados, o) {

    if (t) ret(0, 0, o.w, t.w, 'top');
    if (b) ret(0, o.h - b.w, o.w, b.w, 'bottom');
    if (l) ret(0, 0, l.w, o.h, 'left');
    if (r) ret(o.w - r.w, 0, r.w, o.h, 'right');

  }

  async function preencherFundo(o, cs) {
    const bg = fundo(cs, o.w, o.h, reg);
    if (!bg.raster) return bg.fills;
    try { return [{ type: 'IMAGE', key: reg.dados(await rasterizarFundo(cs, o.w, o.h)), mode: 'FILL' }]; }

  const MODOS_IMG = { cover: 'FILL', contain: 'FIT', 'scale-down': 'FIT', none: 'FILL', fill: 'CROP' };

  async function imagem(el, o, cs) {

  const SVG_PROPS = ['fill', 'fill-opacity', 'fill-rule', 'stroke', 'stroke-width', 'stroke-opacity', 'stroke-linecap',

    for (let i = 0; i < orig.length; i++) {
      const cs = css(orig[i]);
      if (cs.display === 'none' && !/^(defs|symbol|clipPath|mask|linearGradient|radialGradient|pattern|marker|stop|filter)$/i.test(orig[i].tagName) && !orig[i].closest('defs,symbol,clipPath,mask,pattern,marker')) { remover.push(dest[i]); continue; }

const EXT = n => (n.match(/\.([a-z0-9]+)$/i) || [, ''])[1].toLowerCase();
const DOCS = new Set(['html', 'htm', 'xhtml', 'md', 'markdown', 'txt', 'log', 'csv', 'tsv', 'json', 'pdf', 'docx']);
const IMAGENS = new Set(['png', 'jpg', 'jpeg', 'gif', 'webp', 'avif', 'bmp', 'ico']);
const tirarExt = n => n.replace(/\.[^.]+$/, '');

function normalizar(caminho) {
  const out = [];
  for (const p of caminho.replace(/\\/g, '/').split('/')) {
    if (!p || p === '.') continue;
    if (p === '..') out.pop(); else out.push(p);
  }
  return out.join('/').toLowerCase();
}

const externo = u => !u || /^(?:[a-z][a-z0-9+.-]*:|\/\/|#)/i.test(u.trim());

function criarAcervo(arquivos) {
  const porCaminho = new Map(), porNome = new Map();
  for (const { file, path } of arquivos) {
    const url = URL.createObjectURL(file);
    porCaminho.set(normalizar(path), { url, file });
    const nome = file.name.toLowerCase();
    if (!porNome.has(nome)) porNome.set(nome, { url, file });
  }
  return {
    achar(ref, dir) {
      if (externo(ref)) return null;
      const limpo = decodeURIComponent(ref.split(/[?#]/)[0]);
      const alvo = limpo.startsWith('/') ? normalizar(limpo) : normalizar(dir + '/' + limpo);
      return porCaminho.get(alvo) || porNome.get(limpo.split('/').pop().toLowerCase()) || null;
    },
  };
}

const dirDe = p => p.replace(/\\/g, '/').split('/').slice(0, -1).join('/');

function trocarURLsCSS(css, dir, acervo) {
  return css.replace(/url\(\s*(["']?)(.*?)\1\s*\)/g, (m, q, u) => {
    const a = acervo.achar(u, dir);
    return a ? `url("${a.url}")` : m;
  }).replace(/@import\s+(["'])(.*?)\1/g, (m, q, u) => {
    const a = acervo.achar(u, dir);
    return a ? `@import "${a.url}"` : m;
  });
}

async function prepararHTML(html, caminho, acervo) {
  const dir = dirDe(caminho);
  const d = new DOMParser().parseFromString(html, 'text/html');
  for (const link of d.querySelectorAll('link[rel~="stylesheet"][href]')) {
    const href = link.getAttribute('href');
    const a = acervo.achar(href, dir);
    if (!a) continue;
    const st = d.createElement('style');
    st.textContent = trocarURLsCSS(await a.file.text(), dirDe(normalizar(dir + '/' + href.split(/[?#]/)[0])), acervo);
    link.replaceWith(st);
  }
  for (const el of d.querySelectorAll('[src],[href],[poster],[srcset],[data-src]')) {
    for (const at of ['src', 'href', 'poster', 'data-src']) {
      const v = el.getAttribute(at);
      const a = v && acervo.achar(v, dir);
      if (a && !(at === 'href' && el.tagName === 'A')) el.setAttribute(at, a.url);
    }
    if (el.hasAttribute('data-src') && !el.getAttribute('src')) el.setAttribute('src', el.getAttribute('data-src'));
    const ss = el.getAttribute('srcset');
    if (ss) el.setAttribute('srcset', ss.split(',').map(p => {
      const [u, ...r] = p.trim().split(/\s+/);
      const a = acervo.achar(u, dir);
      return [a ? a.url : u, ...r].join(' ');
    }).join(', '));
    if (el.tagName === 'IMG') el.removeAttribute('loading');
  }
  for (const st of d.querySelectorAll('style')) st.textContent = trocarURLsCSS(st.textContent, dir, acervo);
  for (const el of d.querySelectorAll('[style]')) el.setAttribute('style', trocarURLsCSS(el.getAttribute('style'), dir, acervo));
  return '<!DOCTYPE html>' + d.documentElement.outerHTML;
}

const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function inlineMD(s) {

    .replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, '<img alt="$1" src="$2">')
    .replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, '<a href="$2">$1</a>')
    .replace(/\*\*(.+?)\*\*|__(.+?)__/g, (_, a, b) => '<strong>' + (a || b) + '</strong>')

      i += 2;
      while (i < L.length && /\|/.test(L[i]) && L[i].trim()) {
        out += '<tr>' + cel(L[i]).map((c, k) => `<td style="text-align:${alin[k] || 'left'}">${inlineMD(c)}</td>`).join('') + '</tr>'; i++;
      }
      out += '</tbody></table>';
    } else if (/^\s*</.test(l)) {
      const b = [];
      while (i < L.length && L[i].trim()) b.push(L[i++]);
      out += b.join('\n');
    } else {
      const p = [];
      while (i < L.length && L[i].trim() && !/^(#{1,6}\s|\s*```|\s*~~~|\s*>|\s*([-*+]|\d+[.)])\s)/.test(L[i])) p.push(L[i++]);
      out += '<p>' + p.map(inlineMD).join(' ').replace(/<br> /g, '<br>') + '</p>';
    }
  }
  return out;
}

const paginaDoc = (corpo, extra = '') => `<!DOCTYPE html><html><head><meta charset="utf-8"><style>${ESTILO_DOC}${extra}</style></head><body><div class="doc">${corpo}</div></body></html>`;

function csv(texto, sep) {
  const linhas = [];
  let campo = '', linha = [], aspas = false;
  for (let i = 0; i < texto.length; i++) {
    const c = texto[i];
    if (aspas) { if (c === '"' && texto[i + 1] === '"') { campo += '"'; i++; } else if (c === '"') aspas = false; else campo += c; continue; }
    if (c === '"') aspas = true;
    else if (c === sep) { linha.push(campo); campo = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && texto[i + 1] === '\n') i++; linha.push(campo); linhas.push(linha); linha = []; campo = ''; }
    else campo += c;
  }
  if (campo || linha.length) { linha.push(campo); linhas.push(linha); }
  const [cab, ...resto] = linhas.filter(l => l.some(c => c.trim()));
  if (!cab) return '';
  return '<table><thead><tr>' + cab.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr></thead><tbody>' +
    resto.map(l => '<tr>' + l.map(c => '<td>' + esc(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table>';
}

const _scripts = {};
function carregarScript(url) {
  return _scripts[url] || (_scripts[url] = new Promise((ok, erro) => {
    const s = document.createElement('script');
    s.src = url; s.onload = ok; s.onerror = () => erro(new Error('não carregou ' + url));
    document.head.appendChild(s);
  }));
}

const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
const MAMMOTH = 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js';

async function lerPDF(file, nome, progresso) {
  await carregarScript(PDFJS + 'pdf.min.js');
  const lib = window.pdfjsLib;
  if (!lib.GlobalWorkerOptions.workerSrc) {
    try {
      const src = await (await fetch(PDFJS + 'pdf.worker.min.js')).text();
      lib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
    } catch (e) { lib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js'; }
  }
  const pdf = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  const trabalhos = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    progresso && progresso(`${nome}: página ${p}/${pdf.numPages}`);
    const pg = await pdf.getPage(p);
    const vp = pg.getViewport({ scale: 96 / 72 });
    const k = Math.min(2, 4096 / Math.max(vp.width, vp.height));
    const vp2 = pg.getViewport({ scale: 96 / 72 * k });
    const cv = document.createElement('canvas');
    cv.width = Math.ceil(vp2.width); cv.height = Math.ceil(vp2.height);
    await pg.render({ canvasContext: cv.getContext('2d'), viewport: vp2, intent: 'print' }).promise;
    const bytes = await canvasParaBytes(cv);
    trabalhos.push({ name: pdf.numPages > 1 ? `${nome} · página ${p}` : nome, kind: 'tree', images: { PAG: bytes },
      tree: { t: 'F', x: 0, y: 0, w: vp.width, h: vp.height, n: 'página ' + p, clip: true,
        fills: [{ type: 'IMAGE', key: 'PAG', mode: 'FILL' }], c: [] } });
  }
  return trabalhos;
}

async function lerDOCX(file) {
  await carregarScript(MAMMOTH);
  const r = await window.mammoth.convertToHtml({ arrayBuffer: await file.arrayBuffer() });
  return paginaDoc(r.value, '.doc{width:794px;padding:72px 80px;font-family:Calibri,Carlito,Arial,sans-serif;font-size:15px;line-height:1.5}');
}

async function lerImagem(file, nome) {
  const url = URL.createObjectURL(file);
  const im = await carregarImg(url);
  const bytes = await bytesDeImagem(url);
  const w = im.naturalWidth, h = im.naturalHeight;
  return { name: nome, kind: 'tree', images: { IMG: bytes },
    tree: { t: 'R', x: 0, y: 0, w, h, n: nome, fills: [{ type: 'IMAGE', key: 'IMG', mode: 'FILL' }] } };
}

async function lerSVG(file, nome) {
  const txt = await file.text();
  const d = new DOMParser().parseFromString(txt, 'image/svg+xml').documentElement;
  const vb = (d.getAttribute('viewBox') || '').split(/[\s,]+/).map(Number);
  const w = px(d.getAttribute('width')) || vb[2] || 0, h = px(d.getAttribute('height')) || vb[3] || 0;
  if (w && h) { d.setAttribute('width', w); d.setAttribute('height', h); }
  return { name: nome, kind: 'tree', images: {}, tree: { t: 'S', x: 0, y: 0, w, h, n: nome, svg: new XMLSerializer().serializeToString(d) } };
}

async function lerArquivos(arquivos, progresso) {
  const acervo = criarAcervo(arquivos);
  const temDoc = arquivos.some(a => DOCS.has(EXT(a.file.name)));
  const trabalhos = [], erros = [];
  for (const { file, path } of arquivos) {
    const ext = EXT(file.name), nome = tirarExt(file.name);
    try {
      if (ext === 'html' || ext === 'htm' || ext === 'xhtml') {
        trabalhos.push({ name: nome, kind: 'html', html: await prepararHTML(await file.text(), path, acervo) });
      } else if (ext === 'md' || ext === 'markdown') {
        const html = await prepararHTML(paginaDoc(markdown(await file.text())), path, acervo);
        trabalhos.push({ name: nome, kind: 'html', html });
      } else if (ext === 'txt' || ext === 'log') {
        trabalhos.push({ name: nome, kind: 'html', html: paginaDoc('<pre style="background:none;padding:0;margin:0;font:14px/1.55 \'Roboto Mono\',Consolas,monospace">' + esc(await file.text()) + '</pre>') });
      } else if (ext === 'csv' || ext === 'tsv') {
        const t = await file.text(), amostra = t.slice(0, 2000);
        const sep = ext === 'tsv' ? '\t' : amostra.split(';').length > amostra.split(',').length ? ';' : ',';
        trabalhos.push({ name: nome, kind: 'html', html: paginaDoc(csv(t, sep), '.doc{width:auto;display:inline-block}') });
      } else if (ext === 'json') {
        let t = await file.text();
        try { t = JSON.stringify(JSON.parse(t), null, 2); } catch (e) {}
        trabalhos.push({ name: nome, kind: 'html', html: paginaDoc('<pre>' + esc(t) + '</pre>') });
      } else if (ext === 'pdf') {
        trabalhos.push(...await lerPDF(file, nome, progresso));
      } else if (ext === 'docx') {
        trabalhos.push({ name: nome, kind: 'html', html: await lerDOCX(file) });
      } else if (temDoc) {
        continue;
      } else if (ext === 'svg') {
        trabalhos.push(await lerSVG(file, nome));
      } else if (IMAGENS.has(ext) || /^image\//.test(file.type)) {
        trabalhos.push(await lerImagem(file, nome));
      } else {
        erros.push(`${file.name}: formato não suportado`);
      }
    } catch (e) {
      erros.push(`${file.name}: ${e.message || e}`);
    }
  }
  return { trabalhos, erros };
}

const esperar = ms => new Promise(ok => setTimeout(ok, ms));

async function renderizarEMedir(html, opts) {
  const velho = $('palco');
  const f = document.createElement('iframe');
  f.id = 'palco';
  f.style.width = opts.largura + 'px';
  f.style.height = opts.altura + 'px';
  velho.replaceWith(f);
  await Promise.race([
    new Promise(ok => { f.onload = ok; f.srcdoc = html; }),
    esperar(20000),
  ]);
  const doc = f.contentDocument, win = f.contentWindow;
  if (!doc || !doc.body) throw new Error('não foi possível renderizar o documento');
  status('Carregando fontes e imagens…');
  await Promise.race([doc.fonts.ready, esperar(10000)]);
  const pendentes = [...doc.images].filter(im => !im.complete);
  await Promise.race([
    Promise.all(pendentes.map(im => new Promise(ok => { im.onload = im.onerror = ok; }))),
    esperar(10000),
  ]);
  await esperar(opts.espera);
  await Promise.race([doc.fonts.ready, esperar(5000)]);
  const medidor = criarMedidor(doc, win, opts);
  return medidor.medir(status);
}

const paraFigma = msg => parent.postMessage({ pluginMessage: msg }, '*');

let aguardando = null;
window.onmessage = (e) => {
  const m = e.data && e.data.pluginMessage;
  if (!m) return;
  if (m.type === 'opts') aplicarOpcoes(m.opts);
  else if (m.type === 'progress') status(m.text);
  else if ((m.type === 'done' || m.type === 'error') && aguardando) {
    const a = aguardando; aguardando = null;
    m.type === 'done' ? a.ok(m.text) : a.erro(new Error(m.text));
  }
};

function desenhar(items) {
  return new Promise((ok, erro) => {
    aguardando = { ok, erro };
    paraFigma({ type: 'build', items });
  });
}

const $ = id => document.getElementById(id);

const CAMPOS = { largura: 'o-largura', altura: 'o-altura', raiz: 'o-raiz', espera: 'o-espera', quebras: 'o-quebras', achatar: 'o-achatar', svgVetor: 'o-svg' };

function lerOpcoes() {
  const o = {};
  for (const [k, id] of Object.entries(CAMPOS)) {
    const el = $(id);
    o[k] = el.type === 'checkbox' ? el.checked : el.type === 'number' ? +el.value : el.value;
  }
  return o;
}

function aplicarOpcoes(o) {
  if (!o) return;
  for (const [k, id] of Object.entries(CAMPOS)) {
    if (!(k in o)) continue;
    const el = $(id);
    if (el.type === 'checkbox') el.checked = !!o[k]; else el.value = o[k];
  }
}

for (const id of Object.values(CAMPOS)) $(id).addEventListener('change', () => paraFigma({ type: 'save-opts', opts: lerOpcoes() }));

function status(t) { $('status').textContent = t || ''; }

function linha(nome) {
  const li = document.createElement('li');
  li.innerHTML = '<span class="st">…</span><span class="nome"></span><span class="msg"></span>';
  li.querySelector('.nome').textContent = nome;
  $('log').prepend(li);
  return {
    ok(m) { li.className = 'ok'; li.querySelector('.st').textContent = '✓'; li.querySelector('.msg').textContent = m || ''; },
    erro(m) { li.className = 'er'; li.querySelector('.st').textContent = '✕'; li.querySelector('.msg').textContent = m || ''; },
    msg(m) { li.querySelector('.msg').textContent = m; },
  };
}

let ocupado = false;

async function processar(arquivos, colado) {
  if (ocupado) { status('Aguarde a conversão atual terminar.'); return; }
  ocupado = true;
  $('converter').disabled = true;
  const opts = lerOpcoes();
  try {
    status('Lendo arquivos…');
    const { trabalhos, erros } = colado
      ? { trabalhos: [{ name: 'HTML colado', kind: 'html', html: colado }], erros: [] }
      : await lerArquivos(arquivos, status);
    for (const e of erros) linha(e.split(':')[0]).erro(e.split(':').slice(1).join(':').trim());
    for (const t of trabalhos) {
      const l = linha(t.name);
      try {
        let items;
        if (t.kind === 'html') {
          const medidos = await renderizarEMedir(t.html, opts);
          if (!medidos.length) throw new Error('nada visível para converter');
          items = medidos.map((m, i) => ({ name: medidos.length > 1 ? `${t.name} · ${i + 1}` : t.name, tree: m.tree, images: m.images }));
        } else items = [{ name: t.name, tree: t.tree, images: t.images }];
        l.msg('desenhando…');
        const r = await desenhar(items);
        l.ok(r);
      } catch (e) {
        console.error(e);
        l.erro(e.message || String(e));
      }
    }
    status(trabalhos.length ? 'Concluído.' : erros.length ? 'Nenhum arquivo convertido.' : '');
  } catch (e) {
    console.error(e);
    status('Erro: ' + (e.message || e));
  } finally {
    ocupado = false;
    $('converter').disabled = false;
  }
}

async function lerEntrada(entry, caminho, out) {
  if (entry.isFile) {
    const file = await new Promise((ok, erro) => entry.file(ok, erro));
    out.push({ file, path: caminho + file.name });
  } else if (entry.isDirectory) {
    const leitor = entry.createReader();
    let lote;
    do {
      lote = await new Promise((ok, erro) => leitor.readEntries(ok, erro));
      for (const e of lote) await lerEntrada(e, caminho + entry.name + '/', out);
    } while (lote.length);
  }
}

const zona = $('zona');
zona.addEventListener('click', e => { if (e.target === zona || !e.target.closest('button')) $('arquivos').click(); });
$('escolher').onclick = e => { e.stopPropagation(); $('arquivos').click(); };
$('pasta').onclick = e => { e.stopPropagation(); $('diretorio').click(); };
for (const id of ['arquivos', 'diretorio']) {
  $(id).onchange = (e) => {
    const lista = [...e.target.files].map(file => ({ file, path: file.webkitRelativePath || file.name }));
    e.target.value = '';
    if (lista.length) processar(lista);
  };
}
zona.addEventListener('dragover', e => { e.preventDefault(); zona.classList.add('sobre'); });
zona.addEventListener('dragleave', () => zona.classList.remove('sobre'));
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', async (e) => {
  e.preventDefault();
  zona.classList.remove('sobre');
  const out = [];
  const itens = [...(e.dataTransfer.items || [])];
  const entradas = itens.map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (entradas.length) for (const en of entradas) await lerEntrada(en, '', out);
  else for (const file of e.dataTransfer.files) out.push({ file, path: file.name });
  if (out.length) { processar(out); return; }
  const texto = e.dataTransfer.getData('text/html') || e.dataTransfer.getData('text/plain');
  if (texto && /<[a-z!]/i.test(texto)) processar(null, texto);
});

$('converter').onclick = () => {
  const h = $('html').value.trim();
  if (h) processar(null, h);
};

document.addEventListener('paste', (e) => {
  if (e.target.closest && e.target.closest('textarea,input')) return;
  const arquivos = [...e.clipboardData.files].map(file => ({ file, path: file.name }));
  if (arquivos.length) { processar(arquivos); return; }
  const h = e.clipboardData.getData('text/html') || e.clipboardData.getData('text/plain');
  if (h && /<[a-z!]/i.test(h)) processar(null, h);
});

paraFigma({ type: 'load-opts' });
</script>
